name: Publicar HYDRA en GitHub Pages

on:
  push:
    branches:
      - develop
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Descargar proyecto
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: vanilla/package-lock.json

      - name: Instalar dependencias
        working-directory: vanilla
        run: npm ci

      - name: Compilar HYDRA
        working-directory: vanilla
        run: npm run build -- --base=/Hydra/

      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5

      - name: Preparar archivos para publicar
        uses: actions/upload-pages-artifact@v3
        with:
          path: vanilla/dist

      - name: Publicar HYDRA
        id: deployment
        uses: actions/deploy-pages@v4
